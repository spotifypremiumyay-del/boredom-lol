<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloon Pop Birthday Game 🎈</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Gift Screen (shown initially) -->
  <div id="giftScreen" class="gift-screen">
    <div class="gift-container">
      <div class="gift-box" id="giftBox">
        <div class="gift-lid"></div>
        <div class="gift-body"></div>
        <div class="gift-ribbon-v"></div>
        <div class="gift-ribbon-h"></div>
      </div>
      <p class="click-text">Click Me!</p>
    </div>
  </div>

  <!-- Game Screen (hidden initially) -->
  <div id="gameScreen" class="game-screen" style="display: none;">
    <div class="contain">
       <h2 class="name">Balloon Popping</h2>
       <p class="expl">Pop balloons before they reach the top or lose a life!</p>
       <canvas id="canvas" width="800" height="600"></canvas>

       <div class="container_buttons">
          <div class="Life" id="health">Life: 5</div>
          <input type="button" id="start" class="btn btn-primary" value="Start" />
          <input type="button" id="reset" class="btn btn-warning" value="Reset" />
          <div class="score" id="scr">Score: 0</div>
       </div>

       <div id="gameMessage"></div>
    </div>
  </div>

  <!-- Confetti Container -->
  <div id="confettiContainer"></div>

  <script src="script.js"></script>
</body>
</html>
