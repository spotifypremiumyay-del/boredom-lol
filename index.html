<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloon Pop Birthday Game 🎈</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Gift Screen (shown initially) -->
  <div id="merrywrap" class="merrywrap">
    <canvas id="snowfall"></canvas>
    <div class="giftbox">
      <div class="cover">
        <div></div>
      </div>
      <div class="box"></div>
    </div>
    <div class="icons">
      <div class="row"> 
        <span>D</span>
        <span>e</span>
        <span>a</span>
        <span>r</span>
        <span>L</span>
        <span>e</span>
        <span>o</span>
        <span>n</span> 
      </div>
      <div class="row">
          <span class="letter">H</span>
          <span class="letter">a</span>
          <span class="letter">p</span>
          <span class="letter">p</span>
          <span class="letter">y</span>
          <span class="letter">B</span>
          <span class="letter">i</span>
          <span class="letter">r</span>
          <span class="letter">t</span>
          <span class="letter">h</span>
          <span class="letter">d</span>
          <span class="letter">a</span>
          <span class="letter">y</span>
      </div> 
    </div>
  </div>

  <!-- Game Screen (hidden initially) -->
  <div id="gameScreen" class="game-screen" style="display: none;">
    <div class="contain">
       <h2 class="name">Balloon Popping</h2>
       <p class="expl">Pop 20 balloons to get your birthday surprise!</p>
       <canvas id="canvas" width="800" height="600"></canvas>

       <div class="container_buttons">
          <div class="Life" id="health">Life: 5</div>
          <input type="button" id="start" class="btn btn-primary" value="Start" />
          <input type="button" id="reset" class="btn btn-warning" value="Reset" />
          <div class="score" id="scr">Score: 0</div>
       </div>

       <div id="gameMessage"></div>
    </div>
  </div>

  <!-- Confetti Container -->
  <div id="confettiContainer"></div>

  <script src="script.js"></script>
</body>
</html>
